name: Reveries post-merge summaries

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: reveries-post-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthesize:
    name: Summarize host-created commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected default-branch revision
        uses: actions/checkout@v7
        with:
          # The privileged job runs only code from the protected default branch.
          # Pull request commits are fetched below as Git objects and never checked out.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the synthesis library
        run: npm run build

      - name: Configure the authenticated notes remote
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git remote add reveries-post-merge "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git remote set-url --push reveries-post-merge "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

      - name: Synthesize and publish host-created summaries
        env:
          GH_TOKEN: ${{ github.token }}
          REVERIES_POST_MERGE_REMOTE: reveries-post-merge
        run: node scripts/reveries-post-merge.mjs
