name: Reveries controlled merge

# `workflow_run` has no caller-selected ref: GitHub runs this workflow from the
# default branch (`GITHUB_REF` is the default branch). The receive-check is
# privileged only for its read-only base/head binding artifact; this workflow
# verifies that exact run and its artifact before it could merge.
on:
  workflow_run:
    workflows: ["Reveries receive-check"]
    types: [completed]

# Hard fail-closed state pending independent review and external setup. The
# merge job has no write scope and the script itself has MERGE_ENABLED=false.
# Do not restore `pull-requests: write` or flip the script until all of these are
# true: the source-bound artifact protocol is independently reviewed; the
# default-branch ruleset has strict_required_status_checks_policy=true; and the
# `reveries-merge` environment below has required reviewers and protected-branch
# deployment policy configured in repository settings.
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  merge:
    name: Merge after a trusted receive-check
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The required reviewer/deployment-branch policy is configured in GitHub
    # settings, not by this YAML. Without that external protection, this job's
    # workflow_run trigger still runs from the default branch but does not pause
    # for a human approval.
    environment: reveries-merge
    concurrency:
      group: reveries-controlled-merge-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REVERIES_REQUIRED_CHECK: Reveries receive-check
      REVERIES_REQUIRED_APP_SLUG: ${{ vars.REVERIES_REQUIRED_APP_SLUG || 'github-actions' }}
      REVERIES_REQUIRED_APP_ID: ${{ vars.REVERIES_REQUIRED_APP_ID || '15368' }}
      REVERIES_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      REVERIES_MERGE_METHOD: merge
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the source run and refuse merge until approved
        run: node scripts/controlled-merge.mjs
