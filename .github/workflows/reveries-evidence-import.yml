name: Reveries fork evidence import

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  import-evidence:
    name: Import fork evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import notes without executing fork code
        env:
          REVERIES_EVIDENCE_OUTPUT: ${{ runner.temp }}/reveries-fork-evidence.json
        run: node scripts/import-fork-evidence.mjs

      - name: Publish the evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: reveries-fork-evidence-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/reveries-fork-evidence.json
          if-no-files-found: error
