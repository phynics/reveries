name: Reveries fork evidence import

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  import-evidence:
    name: Import fork evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import fork evidence without executing fork code
        uses: ./.github/actions/reveries-evidence-import
        with:
          artifact-name: reveries-fork-evidence-${{ github.event.pull_request.number }}
