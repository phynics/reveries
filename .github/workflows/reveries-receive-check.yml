name: Reveries receive-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  receive-check:
    name: Reveries receive-check
    runs-on: ubuntu-latest
    env:
      REVERIES_REQUIRED_CHECK: Reveries receive-check
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@v7
        with:
          # Keep the workflow, scripts, package metadata, and dependencies on
          # the trusted base revision. Proposed objects are fetched below.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the pinned checker
        run: npm run build

      - name: Fetch proposed code and evidence objects
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "+${HEAD_SHA}:refs/reveries/proposed-head"
          git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "+refs/notes/reveries:refs/notes/reveries"

      - name: Validate the proposed ref and evidence objects
        run: node scripts/github-receive-check.mjs
