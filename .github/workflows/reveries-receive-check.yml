name: Reveries receive-check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  receive-check:
    name: Reveries receive-check
    runs-on: ubuntu-latest
    env:
      REVERIES_REQUIRED_CHECK: Reveries receive-check
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@v7
        with:
          # github.sha is the proposed merge commit for pull_request and the
          # queued head for merge_group, so it would run the proposal's own
          # checker. Proposed objects are fetched below and never executed.
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the pinned checker
        run: npm run build

      - name: Fetch proposed code and evidence objects
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "+${HEAD_SHA}:refs/reveries/proposed-head"
          git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "+refs/notes/reveries:refs/notes/reveries"

      - name: Validate the proposed ref and evidence objects
        run: node scripts/github-receive-check.mjs
