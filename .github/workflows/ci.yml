name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate Reveries
        run: npm run verify

      - name: Test Git 2.39 compatibility
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/work,readonly
          --workdir /work
          node:22.20.0-bookworm
          npm run test:full
