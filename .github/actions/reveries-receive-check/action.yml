name: Reveries receive-check
description: >-
  Validate proposed code and Reveries evidence without executing
  pull-request code. The checker is installed and built from this action's
  source revision; the caller checks out the trusted base revision and this
  action fetches the proposal only as Git objects into the target directory.

inputs:
  target-directory:
    description: >-
      Repository checkout under check. The caller checks out the trusted base
      revision here; proposed objects are fetched into it as Git refs only.
    default: ${{ github.workspace }}
  node-version:
    description: Node.js version used to build the pinned checker.
    default: "22.20.0"
  allow-pr-description-summary:
    description: >-
      Forward pull-request description text as explicitly lower-grade coverage.
      Keep "false" unless the repository policy documents the fallback.
    default: "false"
  fork-evidence-manifest:
    description: >-
      Path to the fork evidence manifest produced by
      reveries-evidence-import. Empty when the head repository can publish
      refs/notes/reveries directly.
    default: ""

runs:
  using: composite
  steps:
    # The action source is this repository at the pinned revision, and these
    # steps must run at its root so the checker never depends on
    # target-directory code. A composite run step starts in the caller's
    # checkout, which is exactly that root.
    #
    # Do not build the pattern from `github.action_path` with "../..":
    # `actions/setup-node` rejects any `cache-dependency-path` that still
    # contains "." or ".." segments, so a self-relative pattern fails the
    # action with "Relative pathing '.' and '..' is not allowed" before a
    # single build step runs.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build the pinned checker
      shell: bash
      run: npm run build

    - name: Fetch proposed code and evidence objects
      shell: bash
      working-directory: ${{ inputs.target-directory }}
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "+${HEAD_SHA}:refs/reveries/proposed-head"
        git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "+refs/notes/reveries:refs/notes/reveries"

    - name: Validate the proposed ref and evidence objects
      shell: bash
      run: |
        set -euo pipefail
        args=(--target-dir "${{ inputs.target-directory }}")
        if [[ "${{ inputs.allow-pr-description-summary }}" == "true" ]]; then
          args+=(--allow-pr-description-summary)
        fi
        if [[ -n "${{ inputs.fork-evidence-manifest }}" ]]; then
          args+=(--fork-evidence-manifest "${{ inputs.fork-evidence-manifest }}")
        fi
        node scripts/github-receive-check.mjs "${args[@]}"
